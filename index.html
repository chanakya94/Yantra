<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yantra</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3e8ff;--dots:#d9c4f7;--win:#fffaf0;--ink:#3b2a5c;--mute:#7a6a9c;--lav:#cdb8ff;--mint:#b9f0d6;--peach:#ffc9b0;--butter:#fff0a8;--pink:#ffb8d9;--sky:#b8e0ff;--field:#ffffff;
--pixel:"Silkscreen","Courier New",monospace;--mono:"VT323","Courier New",monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1535;--dots:#2b2050;--win:#2a1f4a;--ink:#f3e8ff;--mute:#b5a6d9;--field:#382b60}}
:root[data-theme="dark"]{--bg:#1d1535;--dots:#2b2050;--win:#2a1f4a;--ink:#f3e8ff;--mute:#b5a6d9;--field:#382b60}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:var(--mono);font-size:20px;color:var(--ink);-webkit-tap-highlight-color:transparent;
background:var(--bg) radial-gradient(var(--dots) 2px,transparent 2.5px) 0 0/18px 18px}
body{display:flex;flex-direction:column;padding:10px;gap:10px;overflow:hidden}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.win{background:var(--win);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(90deg,var(--lav),var(--pink) 60%,var(--peach));border-bottom:3px solid var(--ink);color:#3b2a5c}
.brand{font-family:var(--pixel);font-weight:700;font-size:17px;letter-spacing:1px}
.brand small{font-family:var(--mono);font-size:19px;font-weight:400;margin-left:4px}
.pill{border:2px solid #3b2a5c;background:var(--butter);color:#3b2a5c;border-radius:8px;box-shadow:2px 2px 0 #3b2a5c;padding:2px 9px;line-height:1.3}
.pill:active{transform:translate(2px,2px);box-shadow:none}
.sp{flex:1}
select.pill{max-width:42%;appearance:none;-webkit-appearance:none;font-size:17px;padding-right:9px}
#chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:14px;min-height:0}
.msg{max-width:86%;padding:8px 12px;border:2px solid var(--ink);border-radius:12px;line-height:1.15;white-space:pre-wrap;word-wrap:break-word;color:#3b2a5c;box-shadow:3px 3px 0 var(--ink)}
.msg.user{align-self:flex-end;background:var(--pink)}
.msg.bot{align-self:flex-start;background:var(--mint)}
.file{align-self:flex-end;background:var(--sky);color:#3b2a5c;border:2px dashed var(--ink);border-radius:10px;padding:6px 10px}
.typing{align-self:flex-start;color:var(--mute)}
.typing::after{content:"▮";animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.empty{margin:auto;text-align:center;max-width:290px}
.sun{width:110px;height:110px;margin:0 auto 14px;border-radius:50%;border:3px solid var(--ink);background:repeating-conic-gradient(var(--peach) 0 15deg,var(--butter) 15deg 30deg);position:relative;animation:spin 40s linear infinite}
.sun::after{content:"";position:absolute;inset:30px;border-radius:50%;background:var(--lav);border:3px solid var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}
.empty h1{font-family:var(--pixel);font-size:20px;margin:0 0 6px}
.empty p{margin:0;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{background:var(--sky);color:#3b2a5c;border:2px solid var(--ink);border-radius:8px;padding:2px 10px;box-shadow:2px 2px 0 var(--ink)}
form{display:flex;align-items:flex-end;gap:8px;padding:10px;border-top:3px solid var(--ink);background:var(--lav)}
textarea{flex:1;resize:none;max-height:110px;background:var(--field);border:2px solid #3b2a5c;border-radius:10px;padding:8px 10px;outline:none;font-size:20px;color:var(--ink)}
textarea:focus{box-shadow:0 0 0 3px var(--butter)}
form .pill{height:42px;font-size:20px;display:grid;place-items:center;padding:0 12px}
.send{background:var(--mint)!important}
.note{text-align:center;font-size:16px;color:var(--mute);padding:2px 0 0}
.scrim{position:fixed;inset:0;background:rgba(40,20,80,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:82%;max-width:320px;transform:translateX(-105%);transition:transform .25s;z-index:6;margin:10px;border-radius:14px}
.drawer.on{transform:none}
.drawer .body{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.new{background:var(--mint);color:#3b2a5c;border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);padding:8px}
.hist{flex:1;overflow-y:auto}
.hist button{display:block;width:100%;text-align:left;padding:7px 8px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist button.cur{background:var(--butter);color:#3b2a5c;border:2px solid var(--ink)}
.hist h4{margin:6px 8px;font-weight:400;color:var(--mute)}
.hrow{display:flex;align-items:center;gap:4px}.hrow .x{width:auto;flex:none;color:var(--mute);padding:4px 8px}
.sheet{position:fixed;inset:0;z-index:7;transform:translateY(105%);transition:transform .25s;margin:10px;padding-top:env(safe-area-inset-top,0px)}
.sheet.on{transform:none}
.sheet .body{padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border:2px solid var(--ink);border-radius:10px;background:var(--field)}
.row small{display:block;color:var(--mute);font-size:17px;line-height:1}
.seg{display:flex;gap:6px}
.seg button{border:2px solid var(--ink);border-radius:8px;padding:0 8px;background:var(--win)}
.seg button.on{background:var(--pink);color:#3b2a5c}
input[type=range]{width:100px;accent-color:#a77bf3}
.status{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:3px solid var(--ink);background:var(--butter);color:#3b2a5c;font-size:18px;line-height:1.1}
.bar2{flex:1;height:12px;border:2px solid #3b2a5c;border-radius:6px;background:#fff;overflow:hidden;min-width:60px}.bar2 i{display:block;height:100%;width:0;background:var(--mint)}
.status #pt{flex:2;font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section class="win" style="flex:1">
  <div class="bar">
    <button class="pill" id="menu" aria-label="Open memory">☰</button>
    <span class="brand">YANTRA<small>यंत्र</small></span>
    <span class="sp"></span>
    <select class="pill" id="model" aria-label="Choose model"><option value="Llama-3.2-1B-Instruct-q4f32_1-MLC" data-size="about 0.9 GB">Llama 1B</option><option value="Qwen2.5-1.5B-Instruct-q4f32_1-MLC" data-size="about 1.3 GB">Qwen 1.5B</option><option value="Qwen2.5-3B-Instruct-q4f32_1-MLC" data-size="about 2.5 GB">Qwen 3B</option></select>
    <button class="pill" id="gear" aria-label="Open settings">⚙</button>
  </div>
  <div class="status" id="status"></div>
  <main id="chat"></main>
  <form id="f">
    <button type="button" class="pill" id="attach" aria-label="Upload document">📎</button>
    <input type="file" id="file" accept=".pdf,.doc,.docx,.txt" hidden>
    <textarea id="in" rows="1" placeholder="Ask Yantra…"></textarea>
    <button class="pill send" aria-label="Send">▶</button>
  </form>
</section>
<div class="note">Chats and the model stay on this phone.</div>

<div class="scrim" id="scrim"></div>
<aside class="win drawer" id="drawer">
  <div class="bar"><span class="brand">Smriti</span><small>(memory)</small></div>
  <div class="body"><button class="new" id="new">+ New chat</button><div class="hist" id="hist"></div></div>
</aside>

<section class="win sheet" id="settings">
  <div class="bar"><span class="brand">Settings</span><span class="sp"></span><button class="pill" id="close" aria-label="Close settings">✕</button></div>
  <div class="body">
    <div class="row">Theme<div class="seg" id="theme"><button data-t="auto" class="on">Auto</button><button data-t="light">Light</button><button data-t="dark">Dark</button></div></div>
    <div class="row"><div>Text size<small>Chat messages</small></div><input type="range" id="size" min="17" max="26" value="20"></div>
    <div class="row"><div>Offline mode<small>Nothing leaves your phone</small></div><b>On</b></div>
    <div class="row"><div>Models<small>Downloads come in a later step</small></div><span>0</span></div>
    <div class="row">Clear all chats<button class="pill" id="clear" style="background:var(--pink)">Clear</button></div>
  </div>
</section>

<script>
const $=id=>document.getElementById(id);
const chat=$('chat'),inp=$('in');
let sessions=[];try{sessions=JSON.parse(localStorage.getItem('yantra.chats')||'[]')}catch(e){}
function save(){try{localStorage.setItem('yantra.chats',JSON.stringify(sessions))}catch(e){}}
let cur=null,fs=20;
/* Reply engine: Phase 3 replaces this with the offline model */
const WLLM='https://esm.run/@mlc-ai/web-llm@0.2.83';
let wl=null,engine=null,loadedId=null,busy=false;
const sel=$('model'),st=$('status');
const setStatus=h=>{st.innerHTML=h};
const lib=async()=>wl||(wl=await import(WLLM));
const label=()=>sel.selectedOptions[0].textContent;
function pickStatus(){
  if(engine&&loadedId===sel.value){setStatus('<span>✔ Offline model ready: '+label()+'</span>');return}
  setStatus('<span>'+label()+' is not on this phone yet ('+sel.selectedOptions[0].dataset.size+').</span><button class="pill" id="get">Get model</button>');
  $('get').onclick=loadModel;
}
async function loadModel(){
  if(busy)return;busy=true;const id=sel.value;
  if(!navigator.gpu){setStatus('<span>No WebGPU here. Update iOS and open Yantra in Safari.</span>');busy=false;return}
  try{
    setStatus('<span id="pt">Starting…</span><div class="bar2"><i id="pb"></i></div>');
    const m=await lib();
    if(engine){try{await engine.unload()}catch(e){}engine=null;loadedId=null}
    engine=await m.CreateMLCEngine(id,{initProgressCallback:p=>{const t=$('pt'),b=$('pb');if(t)t.textContent=String(p.text).slice(0,60);if(b)b.style.width=Math.round(p.progress*100)+'%'}});
    loadedId=id;
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  }catch(e){
    engine=null;busy=false;
    setStatus('<span>Could not load: '+String(e&&e.message||e).slice(0,90)+'</span><button class="pill" id="get">Retry</button>');$('get').onclick=loadModel;return;
  }
  busy=false;pickStatus();
}
sel.onchange=pickStatus;
async function respond(msgs,onTok){
  if(!engine||loadedId!==sel.value)return 'Tap Get model above first. It downloads once, then Yantra works offline.';
  const h=[{role:'system',content:'You are Yantra, a friendly assistant running offline on the user\'s iPhone. Keep answers short and clear.'}];
  msgs.filter(m=>m.r!=='file').slice(-12).forEach(m=>h.push({role:m.r==='bot'?'assistant':'user',content:m.t}));
  try{
    let out='';
    const ch=await engine.chat.completions.create({messages:h,stream:true,temperature:0.7,max_tokens:512});
    for await(const c of ch){out+=(c.choices[0]&&c.choices[0].delta&&c.choices[0].delta.content)||'';onTok(out)}
    return out||'(no reply)';
  }catch(e){return 'Something went wrong: '+String(e&&e.message||e).slice(0,100)}
}
pickStatus();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const replies=['Here is a simple way to see it. Once an offline model is connected, I will answer right here on your phone.','Good question. In the finished app this reply is made on your iPhone with no internet.','Got it. Tell me more and I will break it into clear steps.'];
function render(){
  chat.innerHTML='';const s=sessions[cur];
  if(!s||!s.msgs.length){
    chat.innerHTML='<div class="empty"><div class="sun"></div><h1>Namaste</h1><p>I am Yantra, your pocket mind. Ask me anything or hand me a document.</p><div class="chips"><span class="chip">Summarize a PDF</span><span class="chip">Draft an email</span><span class="chip">Explain a topic</span></div></div>';
    chat.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{inp.value=c.textContent;inp.focus()});
  } else s.msgs.forEach(add);
  hist();
}
function add(m){const d=document.createElement('div');d.className=m.r==='file'?'file':'msg '+m.r;d.textContent=m.t;d.style.fontSize=fs+'px';chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function hist(){$('hist').innerHTML=sessions.length?'<h4>Recent</h4>':'<h4>No chats yet</h4>';sessions.forEach((s,i)=>{const w=document.createElement('div');w.className='hrow';const b=document.createElement('button');b.textContent=s.title;if(i===cur)b.className='cur';b.onclick=()=>{cur=i;render();drawer(false)};const x=document.createElement('button');x.className='x';x.textContent='✕';x.setAttribute('aria-label','Delete chat');x.onclick=()=>{sessions.splice(i,1);if(cur===i)cur=null;else if(cur>i)cur--;save();render()};w.append(b,x);$('hist').appendChild(w)})}
function push(t,r){if(cur===null){sessions.unshift({title:'New chat',msgs:[]});cur=0}const s=sessions[cur];if(s.title==='New chat'&&r==='user')s.title=t.slice(0,30);s.msgs.push({r,t});save()}
$('f').onsubmit=e=>{e.preventDefault();const t=inp.value.trim();if(!t)return;push(t,'user');inp.value='';inp.style.height='auto';render();
  const ty=document.createElement('div');ty.className='typing';ty.textContent='Yantra is thinking';chat.appendChild(ty);chat.scrollTop=chat.scrollHeight;
  const i=cur;respond(sessions[i].msgs,p=>{ty.className='msg bot';ty.style.fontSize=fs+'px';ty.textContent=p;chat.scrollTop=chat.scrollHeight}).then(t=>{sessions[i].msgs.push({r:'bot',t});save();if(cur===i)render()})};
inp.oninput=()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,110)+'px'};
$('attach').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;push('📄 '+f.name,'file');push('Received '+f.name+'. In the finished app I will read it on your phone and answer questions about it.','bot');render();e.target.value=''};
function drawer(on){$('drawer').classList.toggle('on',on);$('scrim').classList.toggle('on',on)}
$('menu').onclick=()=>drawer(true);$('scrim').onclick=()=>drawer(false);
$('new').onclick=()=>{cur=null;render();drawer(false)};
$('gear').onclick=()=>$('settings').classList.add('on');$('close').onclick=()=>$('settings').classList.remove('on');
$('theme').onclick=e=>{const t=e.target.dataset.t;if(!t)return;[...$('theme').children].forEach(b=>b.classList.toggle('on',b===e.target));t==='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',t)};
$('size').oninput=e=>{fs=+e.target.value;document.querySelectorAll('.msg,.file').forEach(m=>m.style.fontSize=fs+'px')};
$('clear').onclick=()=>{sessions=[];cur=null;save();render();$('settings').classList.remove('on')};
render();
</script>
</body>
</html>
